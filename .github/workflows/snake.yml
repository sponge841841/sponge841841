name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    # 毎日 10:43 JST。GitHub Actionsのスケジュール実行には遅延する場合があります。
    - cron: '43 1 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate light and dark SVG animations
        # Platane/snk@v3 (2026-10-16時点のタグSHAを固定)
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: sponge841841
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish SVG files to output branch
        # crazy-max/ghaction-github-pages@v5 (2026-10-16時点のタグSHAを固定)
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: 'chore: refresh contribution snake'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
